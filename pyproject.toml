[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbirig"
version = "0.3.0"
description = "Space Mission Verification Harness"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "behave>=1.3,<1.4",
    "pytest>=8,<10",
]
dev = [
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
