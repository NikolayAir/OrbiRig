[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbirig"
version = "0.9.0"
description = "Verification harness for simplified spacecraft command results"
requires-python = ">=3.12,<3.16"
# The core uses only Python's standard library and needs no extra packages to run.
# The web extra lists the optional packages needed for the HTTP server.
dependencies = []

[project.scripts]
orbirig = "orbirig.cli:main"

[project.optional-dependencies]
test = [
    "behave>=1.3,<1.4",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
]
dev = [
    "pyright==1.1.414",
    "ruff==0.17.0",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests", "features/steps", "scripts"]
extraPaths = ["src"]
typeCheckingMode = "standard"
# Check syntax and standard-library use against the minimum supported Python, not the local default.
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the default checks and the rules reviewed for this project.
select = [
    "E4", "E7", "E9", "F",
    "EXE002", "I001", "ISC004", "PLR0402",
    "RUF007", "TRY004", "UP017", "UP022",
]
# ISC004 is a preview rule in the pinned Ruff version.
preview = true
explicit-preview-rules = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=orbirig",
    "--cov-branch",
    "--cov-report=term-missing",
]
