<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set appearance before loading the stylesheet and the app.
      {
        function savedPreference(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        }
        const { dataset } = document.documentElement;
        const theme = savedPreference("orbirig-color-theme");
        const size = savedPreference("orbirig-text-size");
        dataset.themePreference = theme === "day" || theme === "night" ? theme : "system";
        dataset.theme = dataset.themePreference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day")
          : dataset.themePreference;
        dataset.textSize = size === "small" || size === "large" ? size : "medium";
      }
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/orbirig-mark.svg?v=2" />
    <title>OrbiRig | Verification and evidence inspection</title>
    <meta name="description" content="Compare recorded command results with explicit expectations, and recompute saved results instead of trusting them." />
    <meta property="og:title" content="OrbiRig | Verification and evidence inspection" />
    <meta property="og:description" content="Compare recorded command results with explicit expectations, and recompute saved results instead of trusting them." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
