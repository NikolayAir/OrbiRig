name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: python -m pip install ".[test,dev,web]"

      - name: Check package imports
        run: |
          python - <<'PY'
          import orbirig.evidence
          import orbirig.execution
          import orbirig.models
          import orbirig.reference_sut
          import orbirig.subprocess_collection
          import orbirig.verification
          import orbirig.web
          import orbirig.workflow

          print("OrbiRig imports passed")
          PY

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run Behave scenarios
        run: behave

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check built frontend serving
        env:
          PYTHONPATH: src
        run: |
          python - <<'PYTHON'
          from fastapi.testclient import TestClient

          from orbirig.web import app

          response = TestClient(app).get("/")

          assert response.status_code == 200
          assert '<div id="root"></div>' in response.text

          print("Built frontend serving passed")
          PYTHON
