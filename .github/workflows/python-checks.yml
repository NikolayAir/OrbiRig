name: Python checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: python -m pip install ".[test,dev]"

      - name: Check package imports
        run: |
          python - <<'PY'
          import orbirig.evidence
          import orbirig.execution
          import orbirig.models
          import orbirig.reference_sut
          import orbirig.verification
          import orbirig.workflow

          print("OrbiRig imports passed")
          PY

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run Behave scenarios
        run: behave
