services:
  - type: web
    name: orbirig-evidence-inspector
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # Select Render's interpreter explicitly instead of the local .python-version.
    buildCommand: >-
      uv sync --locked --no-default-groups --extra web --python "$PYTHON_VERSION" --no-python-downloads
      && cd frontend && npm ci && npm run build
    startCommand: .venv/bin/python -m uvicorn orbirig.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        # Pin deployment separately from the development default in .python-version.
        value: "3.12.16"
      - key: UV_VERSION
        # Match the uv version used in CI.
        value: "0.13.4"
      - key: NODE_VERSION
        # Keep the frontend build on the same Node.js LTS release as .node-version.
        value: "26.13.0"
